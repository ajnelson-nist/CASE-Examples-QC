repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8
        args:
          - --extend-ignore=E501
  - repo: https://github.com/pycqa/isort
    rev: 10.0.0b2
    hooks:
      - id: isort
        name: isort (python)
